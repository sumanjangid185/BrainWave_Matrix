<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="expensetrackers.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <div class="container">
        <!-- Expense Tracker Box -->
        <div class="tracker">
            <h2>Expense Tracker</h2>
            <div class="balance-box">
                <p>Balance: <span id="balance">₹0</span></p>
            </div>
            <div class="summary">
                <div class="income">Income: <span id="income">₹0</span></div>
                <div class="expense">Expense: <span id="expense">₹0</span></div>
            </div>

            <form id="transaction-form">
                <input type="text" id="description" placeholder="Enter Description">
                <input type="number" id="amount" placeholder="Enter Amount">
                <select id="category">
                    <option value="income">Income</option>
                    <option value="expense">Expense</option>
                </select>
                <button type="submit">Add Transaction</button>
            </form>

            <ul id="transaction-list"></ul>
        </div>

        <!-- Chart Box -->
        <div class="chart-container">
            <h2>Expense & Income Chart</h2>
            <canvas id="expenseChart"></canvas>
        </div>
    </div>

    <script src="trackerscript.js"></script>
</body>
</html>
